<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>メンメンレディオ 探究コーチ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Syne:wght@400;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:          #f5f2ed;
  --surface:     #faf8f5;
  --card:        #ffffff;
  --border:      #e0d9cf;
  --border-dark: #c8bfb0;
  --ink:         #1a1612;
  --ink-mid:     #4a4038;
  --ink-muted:   #8a7d6e;
  --accent:      #e8420a;
  --accent-pale: #fff0eb;
  --accent-dim:  rgba(232,66,10,0.15);
  --teal:        #0a6e6e;
  --teal-pale:   #e8f5f5;
  --amber:       #b85c00;
  --amber-pale:  #fff8e8;
  --step-idle:   #ddd5c8;
  --step-done:   #1a1612;
  --step-active: #e8420a;
  --radius:      14px;
  --shadow:      0 2px 16px rgba(26,22,18,0.08);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans JP', sans-serif;
  background: var(--bg);
  color: var(--ink);
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background-image:
    radial-gradient(ellipse at 20% 50%, rgba(232,66,10,0.03) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 20%, rgba(10,110,110,0.03) 0%, transparent 50%);
}

/* ═══ HEADER ═══ */
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0.9rem 1.5rem;
  display: flex;
  align-items: center;
  gap: 1rem;
  flex-shrink: 0;
  position: relative;
}
.logo-mark {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 1.1rem;
  letter-spacing: -0.02em;
  color: var(--accent);
  white-space: nowrap;
}
.header-divider { width:1px; height:24px; background:var(--border-dark); flex-shrink:0; }
.header-info { flex:1; min-width:0; }
.header-topic {
  font-size:0.8rem; color:var(--ink-muted); font-weight:400;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  transition:all 0.4s; height:1.2em;
}
.header-topic.has-topic { color:var(--ink-mid); font-weight:500; }

.step-track { display:flex; align-items:center; gap:6px; margin-top:5px; }
.step-pip {
  width:8px; height:8px; border-radius:50%;
  background:var(--step-idle); transition:background 0.4s, transform 0.3s; flex-shrink:0;
}
.step-pip.done  { background:var(--step-done); }
.step-pip.active { background:var(--step-active); transform:scale(1.3); box-shadow:0 0 0 3px var(--accent-dim); }
.step-name {
  font-size:0.7rem; color:var(--ink-muted); margin-left:4px;
  font-family:'Syne',sans-serif; letter-spacing:0.04em; text-transform:uppercase;
}

/* ═══ TAB NAV ═══ */
.tab-nav {
  display:flex; gap:4px; margin-left:auto;
  background:rgba(26,22,18,0.07); border-radius:10px; padding:3px; flex-shrink:0;
}
.tab-btn {
  padding:5px 13px; border-radius:7px; border:none;
  background:transparent; color:var(--ink-muted);
  font-family:'Noto Sans JP',sans-serif; font-size:12px; font-weight:700;
  cursor:pointer; transition:all 0.2s;
}
.tab-btn.active { background:var(--ink); color:white; }
.tab-btn:not(.active):hover { color:var(--ink); }

/* ═══ SCREENS ═══ */
.screen { display:none; flex:1; flex-direction:column; overflow:hidden; min-height:0; }
.screen.active { display:flex; }

/* ═══ CHAT ═══ */
#chat {
  flex:1; overflow-y:auto; padding:1.5rem 1.25rem 0.5rem;
  display:flex; flex-direction:column; gap:1.25rem; scroll-behavior:smooth;
}
#chat::-webkit-scrollbar { width:4px; }
#chat::-webkit-scrollbar-track { background:transparent; }
#chat::-webkit-scrollbar-thumb { background:var(--border-dark); border-radius:2px; }

.msg { display:flex; gap:0.75rem; animation:slideUp 0.25s ease; max-width:84%; }
@keyframes slideUp {
  from { opacity:0; transform:translateY(8px); }
  to   { opacity:1; transform:translateY(0); }
}
.msg.user { align-self:flex-end; flex-direction:row-reverse; }
.msg.ai   { align-self:flex-start; }
.msg-avatar {
  width:30px; height:30px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:0.85rem; flex-shrink:0; margin-top:2px;
}
.msg.user .msg-avatar { background:var(--ink); color:var(--surface); font-family:'Syne',sans-serif; font-weight:700; font-size:0.7rem; }
.msg.ai   .msg-avatar { background:var(--accent); color:white; font-size:0.9rem; }
.msg-body { display:flex; flex-direction:column; gap:4px; }
.msg-tag {
  font-family:'Syne',sans-serif; font-size:0.62rem; font-weight:700;
  letter-spacing:0.08em; text-transform:uppercase;
  padding:2px 8px; border-radius:20px; width:fit-content;
}
.tag-coach { background:var(--accent-dim); color:var(--accent); }
.tag-vocab { background:var(--teal-pale); color:var(--teal); }
.tag-guard { background:#ffeaea; color:#c0392b; }
.tag-hint  { background:var(--amber-pale); color:var(--amber); }
.msg-bubble {
  padding:0.8rem 1.1rem; border-radius:var(--radius);
  font-size:0.95rem; line-height:1.75; position:relative;
}
.msg.user .msg-bubble { background:var(--ink); color:var(--surface); border-bottom-right-radius:4px; font-weight:500; }
.msg.ai   .msg-bubble { background:var(--card); color:var(--ink); border:1px solid var(--border); border-bottom-left-radius:4px; box-shadow:var(--shadow); }

.theme-card {
  background:var(--card); border:1px solid var(--border); border-left:3px solid var(--ink);
  border-radius:var(--radius); padding:1.25rem 1.5rem; box-shadow:var(--shadow); animation:slideUp 0.35s ease;
}
.theme-card-label { font-family:'Syne',sans-serif; font-size:0.65rem; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-muted); margin-bottom:0.6rem; }
.theme-card-title { font-family:'Noto Serif JP',serif; font-size:1.05rem; font-weight:700; color:var(--ink); line-height:1.5; margin-bottom:1rem; padding-bottom:0.75rem; border-bottom:1px solid var(--border); }
.theme-row { margin-top:0.6rem; font-size:0.88rem; line-height:1.65; color:var(--ink-mid); }
.theme-row strong { font-weight:700; color:var(--ink); display:block; font-size:0.75rem; font-family:'Syne',sans-serif; letter-spacing:0.05em; text-transform:uppercase; margin-bottom:2px; }

.typing-wrap { display:flex; gap:0.75rem; align-self:flex-start; animation:slideUp 0.2s ease; }
.typing-bubble {
  background:var(--card); border:1px solid var(--border);
  border-radius:var(--radius); border-bottom-left-radius:4px;
  padding:0.9rem 1.1rem; display:flex; align-items:center; gap:6px; box-shadow:var(--shadow);
}
.typing-dot { width:7px; height:7px; border-radius:50%; background:var(--ink-muted); animation:blink 1.2s infinite; }
.typing-dot:nth-child(2) { animation-delay:0.2s; }
.typing-dot:nth-child(3) { animation-delay:0.4s; }
@keyframes blink {
  0%,80%,100% { opacity:0.3; transform:scale(0.9); }
  40% { opacity:1; transform:scale(1.1); }
}
.burst-count { font-size:0.72rem; color:var(--ink-muted); margin-left:6px; font-family:'Syne',sans-serif; }

/* ═══ QUICK REPLIES ═══ */
#quick-replies { padding:0.5rem 1.25rem; display:flex; gap:0.5rem; flex-wrap:wrap; flex-shrink:0; }
.chip {
  background:var(--card); border:1px solid var(--border-dark); color:var(--ink-mid);
  padding:0.4rem 0.9rem; border-radius:20px; font-size:0.82rem; cursor:pointer;
  font-family:'Noto Sans JP',sans-serif; transition:all 0.18s; line-height:1.4;
}
.chip:hover { border-color:var(--accent); color:var(--accent); background:var(--accent-pale); }

/* ═══ INPUT ═══ */
#input-area {
  padding:0.75rem 1.25rem 1rem; border-top:1px solid var(--border);
  display:flex; gap:0.75rem; align-items:flex-end; flex-shrink:0; background:var(--surface);
}
#user-input {
  flex:1; background:var(--card); border:1.5px solid var(--border-dark); color:var(--ink);
  font-family:'Noto Sans JP',sans-serif; font-size:0.95rem; padding:0.75rem 1rem;
  border-radius:var(--radius); resize:none; outline:none;
  min-height:46px; max-height:130px; line-height:1.6; transition:border-color 0.2s, box-shadow 0.2s;
}
#user-input:focus { border-color:var(--ink); box-shadow:0 0 0 3px rgba(26,22,18,0.06); }
#user-input::placeholder { color:var(--ink-muted); }
#send-btn {
  width:46px; height:46px; border-radius:50%; background:var(--ink); border:none;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  flex-shrink:0; transition:all 0.2s;
}
#send-btn:hover { background:var(--accent); transform:scale(1.06); }
#send-btn svg { width:18px; height:18px; }

/* ═══ RESEARCH SCREEN ═══ */
#research-area {
  flex:1; overflow-y:auto; padding:20px 16px;
  display:flex; flex-direction:column; gap:14px;
  max-width:680px; width:100%; margin:0 auto;
}

.research-intro {
  background:var(--card); border:1px solid var(--border);
  border-radius:var(--radius); padding:16px 18px;
  font-size:13px; line-height:1.7; color:var(--ink-mid);
}
.research-intro strong { color:var(--teal); display:block; font-size:13px; font-weight:700; margin-bottom:4px; }

/* ── Search box ── */
.search-box {
  background:var(--card); border:1px solid var(--border);
  border-radius:var(--radius); padding:16px; display:flex; flex-direction:column; gap:12px;
}
.search-box label {
  font-size:10px; font-weight:700; letter-spacing:1.5px; color:var(--ink-muted);
}

/* ── Inputs ── */
.search-input-row { display:flex; gap:8px; }
#research-input {
  flex:1; background:var(--bg); border:1px solid var(--border); border-radius:10px;
  padding:10px 14px; color:var(--ink); font-family:'Noto Sans JP',sans-serif;
  font-size:14px; outline:none; transition:border-color 0.2s;
}
#research-input:focus { border-color:var(--teal); box-shadow:0 0 0 3px rgba(10,110,110,0.1); }
#research-input::placeholder { color:var(--ink-muted); }
#research-btn {
  padding:10px 18px; background:var(--accent); border:none; border-radius:10px;
  color:white; font-family:'Noto Sans JP',sans-serif; font-size:13px; font-weight:700;
  cursor:pointer; transition:all 0.2s; white-space:nowrap;
}
#research-btn:hover { opacity:0.88; transform:scale(1.02); }
#research-btn:disabled { opacity:0.4; cursor:not-allowed; transform:none; }

/* ── Paper search ── */
.paper-search {
  background:var(--teal-pale); border:1px solid rgba(10,110,110,0.2);
  border-radius:10px; padding:12px 14px;
}
.paper-search-label { font-size:10px; font-weight:700; letter-spacing:1.5px; color:var(--teal); margin-bottom:6px; }
.paper-search-desc  { font-size:12px; color:var(--ink-muted); margin-bottom:8px; line-height:1.6; }
.paper-search-links { display:flex; flex-direction:column; gap:5px; }
.paper-search-link {
  display:flex; align-items:center; gap:10px;
  background:var(--card); border:1px solid rgba(10,110,110,0.15); border-radius:8px;
  padding:8px 12px; font-size:13px; color:var(--ink-mid);
  text-decoration:none; transition:all 0.2s; font-family:'Noto Sans JP',sans-serif;
}
.paper-search-link:hover { border-color:var(--teal); color:var(--teal); background:rgba(10,110,110,0.05); }
.paper-search-link-icon { font-size:16px; flex-shrink:0; }
.paper-search-link-body { flex:1; }
.paper-search-link-name { font-weight:700; font-size:12px; display:block; }
.paper-search-link-desc { font-size:11px; color:var(--ink-muted); }

/* ── Results ── */
.research-history-header { display:flex; align-items:center; justify-content:space-between; padding:2px 0 6px; }
.research-history-label  { font-size:10px; font-weight:700; letter-spacing:1.5px; color:var(--ink-muted); }
.research-clear-btn {
  font-size:11px; color:var(--ink-muted); background:none;
  border:1px solid var(--border); border-radius:6px; padding:3px 10px;
  cursor:pointer; font-family:'Noto Sans JP',sans-serif; transition:all 0.2s;
}
.research-clear-btn:hover { color:var(--accent); border-color:var(--accent); background:var(--accent-pale); }

.research-result {
  background:var(--card); border:1px solid var(--border);
  border-radius:var(--radius); padding:18px 20px; animation:fadeUp 0.3s ease-out;
}
@keyframes fadeUp {
  from { opacity:0; transform:translateY(8px); }
  to   { opacity:1; transform:translateY(0); }
}
.research-result-header  { font-size:10px; font-weight:700; letter-spacing:1.5px; color:var(--accent); margin-bottom:10px; }
.research-keyword-tag {
  display:inline-block; background:var(--teal-pale);
  border:1px solid rgba(10,110,110,0.2); border-radius:6px;
  padding:2px 8px; font-size:11px; color:var(--teal); margin-bottom:10px;
}
.research-summary  { font-size:13px; line-height:1.8; color:var(--ink-mid); margin-bottom:12px; white-space:pre-wrap; }
.research-divider  { border:none; border-top:1px solid var(--border); margin:12px 0; }
.research-questions-label { font-size:10px; font-weight:700; letter-spacing:1.5px; color:var(--teal); margin-bottom:8px; }
.research-questions { display:flex; flex-direction:column; gap:6px; }
.research-q {
  background:var(--teal-pale); border:1px solid rgba(10,110,110,0.15);
  border-radius:10px; padding:10px 14px; font-size:13px; line-height:1.6; color:var(--ink-mid);
  cursor:pointer; transition:all 0.2s; display:flex; gap:8px; align-items:flex-start;
  text-align:left; width:100%; font-family:'Noto Sans JP',sans-serif;
}
.research-q:hover { background:rgba(10,110,110,0.12); color:var(--ink); }
.research-q-icon  { color:var(--teal); flex-shrink:0; }

.research-loading {
  display:flex; align-items:center; gap:12px; padding:16px 18px;
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  font-size:13px; color:var(--ink-muted);
}
.research-loading-dots { display:flex; gap:4px; }
.research-loading-dots span { width:6px; height:6px; border-radius:50%; background:var(--accent); animation:bounce 1.2s infinite; }
.research-loading-dots span:nth-child(2) { animation-delay:0.2s; }
.research-loading-dots span:nth-child(3) { animation-delay:0.4s; }
@keyframes bounce {
  0%,60%,100% { transform:translateY(0); opacity:0.4; }
  30% { transform:translateY(-5px); opacity:1; }
}



.research-sources { margin-top:10px; display:flex; flex-direction:column; gap:4px; }
.research-sources-label { font-size:10px; font-weight:700; letter-spacing:1.5px; color:var(--ink-muted); margin-bottom:4px; }
.source-link {
  display:flex; align-items:center; gap:7px; font-size:11px; color:var(--ink-muted);
  text-decoration:none; padding:5px 10px; border-radius:7px;
  background:var(--bg); border:1px solid var(--border); transition:all 0.2s; overflow:hidden;
}
.source-link:hover { color:var(--teal); border-color:var(--teal); background:var(--teal-pale); }
.source-link-text { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; }
.source-badge { flex-shrink:0; font-size:9px; font-weight:700; padding:2px 6px; border-radius:4px; white-space:nowrap; }
.badge-trusted { background:var(--teal-pale); color:var(--teal); border:1px solid rgba(10,110,110,0.3); }
.badge-caution { background:var(--accent-pale); color:var(--accent); border:1px solid rgba(232,66,10,0.3); }
.badge-unknown { background:var(--amber-pale); color:var(--amber); border:1px solid rgba(184,92,0,0.25); }
.badge-pdf { background:#e8f0fe; color:#1a56c4; border:1px solid rgba(26,86,196,0.3); }
.source-note { font-size:11px; color:var(--ink-muted); margin:2px 0 6px; padding-left:2px; }

.google-suggest {
  background:var(--amber-pale); border:1px solid rgba(184,92,0,0.2); border-radius:10px; padding:12px 14px; margin-top:4px;
}
.google-suggest-label { font-size:10px; font-weight:700; letter-spacing:1.5px; color:var(--amber); margin-bottom:6px; }
.google-suggest-desc  { font-size:12px; color:var(--ink-muted); margin-bottom:8px; line-height:1.6; }
.google-suggest-words { display:flex; flex-direction:column; gap:5px; }
.google-suggest-word {
  display:flex; align-items:center; gap:8px;
  background:var(--card); border:1px solid var(--border); border-radius:8px;
  padding:7px 12px; font-size:13px; color:var(--ink-mid); cursor:pointer;
  transition:all 0.2s; text-decoration:none; font-family:'Noto Sans JP',sans-serif;
}
.google-suggest-word:hover { border-color:var(--amber); color:var(--amber); }

.research-error {
  background:var(--accent-pale); border:1px solid rgba(232,66,10,0.2);
  border-radius:var(--radius); padding:14px 18px; font-size:13px; color:var(--accent); line-height:1.6;
}
</style>
</head>
<body>

<header>
  <div class="logo-mark">メンメン<br>レディオ</div>
  <div class="header-divider"></div>
  <div class="header-info" id="header-info-wrap">
    <div class="header-topic" id="header-topic">なんでも探究コーチ</div>
    <div class="step-track">
      <div class="step-pip" id="pip0"></div>
      <div class="step-pip" id="pip1"></div>
      <div class="step-pip" id="pip2"></div>
      <div class="step-pip" id="pip3"></div>
      <div class="step-pip" id="pip4"></div>
      <span class="step-name" id="step-name">START</span>
    </div>
  </div>
  <div class="tab-nav">
    <button class="tab-btn active" id="tab-coach" onclick="switchTab('coach')">✦ コーチング</button>
    <button class="tab-btn" id="tab-research" onclick="switchTab('research')">🔍 リサーチ</button>
  </div>
</header>

<!-- ═══ COACHING SCREEN ═══ -->
<div class="screen active" id="screen-coach">
  <div id="chat"></div>
  <div id="quick-replies"></div>
  <div id="input-area">
    <textarea id="user-input" placeholder="気になること、なんでも話して…" rows="1"></textarea>
    <button id="send-btn" aria-label="送信">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>
</div>

<!-- ═══ RESEARCH SCREEN ═══ -->
<div class="screen" id="screen-research">
  <div id="research-area">

    <div class="research-intro">
      <strong>🔍 なんでもリサーチ</strong>
      テーマとキーワードを入力して調べてみよう。スポーツ・社会・科学・文化…どんな探究テーマでもOK！
    </div>

    <div class="search-box">
      <!-- キーワード入力 -->
      <label>SEARCH KEYWORD</label>
      <div class="search-input-row">
        <input type="text" id="research-input" placeholder="調べたいキーワードを入力...">
        <button id="research-btn" onclick="doResearch()">調べる</button>
      </div>
    </div>

    <!-- 履歴ヘッダー -->
    <div id="research-history-header" style="display:none">
      <div class="research-history-header">
        <span class="research-history-label">📋 検索履歴</span>
        <button class="research-clear-btn" onclick="clearHistory()">履歴を削除</button>
      </div>
    </div>

    <div id="research-results"></div>
  </div>
</div>

<script>
// ══════════════════════════════════════════
//  CATEGORY / KEYWORD DEFINITIONS
// ══════════════════════════════════════════
// ══════════════════════════════════════════
//  STEP DEFINITIONS
// ══════════════════════════════════════════
const STEPS = [
  { name: 'SPARK',   label: '興味を探る' },
  { name: 'ZOOM',    label: '視点を絞る' },
  { name: 'COMPARE', label: '比べてみる' },
  { name: 'SHARPEN', label: '問いを磨く' },
  { name: 'THEME',   label: 'テーマ完成' },
];

// ══════════════════════════════════════════
//  NG PATTERNS
// ══════════════════════════════════════════
const NG = /おっぱい|ちんこ|うんこ|ちんちん|セックス|エッチ|変態|死ね|殺せ|バカ死ね|氏ね|クソ野郎/i;

// ══════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════
let state = {
  topic:       null,
  step:        0,
  history:     [],
  turnCount:   0,
  stuckCount:  0,
  lastContext: '',
};

let queue      = [];
let processing = false;
let burstTimer = null;
const BURST_MS = 800;

// ══════════════════════════════════════════
//  DOM
// ══════════════════════════════════════════
const $chat  = document.getElementById('chat');
const $input = document.getElementById('user-input');

//  HELPERS
// ══════════════════════════════════════════
function scrollEnd() { $chat.scrollTop = $chat.scrollHeight; }

function updatePips(newStep) {
  state.step = Math.min(Math.max(newStep, 0), 4);
  for (let i = 0; i < 5; i++) {
    const p = document.getElementById('pip' + i);
    p.className = 'step-pip';
    if (i < state.step)        p.classList.add('done');
    else if (i === state.step) p.classList.add('active');
  }
  $sname.textContent = STEPS[state.step].name;
}

function updateTopic(t) {
  if (!t || t === state.topic) return;
  state.topic = t;
  $topic.classList.add('has-topic');
  $topic.style.transition = 'opacity 0.18s';
  $topic.style.opacity = '0';
  setTimeout(() => {
    $topic.textContent = '「' + t + '」を探究中';
    $topic.style.opacity = '1';
  }, 180);
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

function aiMsg(html, tagKey = null) {
  const tagMap = {
    coach: ['COACH',  'tag-coach'],
    vocab: ['用語解説','tag-vocab'],
    guard: ['待って！','tag-guard'],
    hint:  ['ヒント', 'tag-hint'],
  };
  const wrap = document.createElement('div');
  wrap.className = 'msg ai';
  const av = document.createElement('div');
  av.className = 'msg-avatar'; av.textContent = '✦';
  const body = document.createElement('div');
  body.className = 'msg-body';
  if (tagKey && tagMap[tagKey]) {
    const [label, cls] = tagMap[tagKey];
    const tag = document.createElement('div');
    tag.className = `msg-tag ${cls}`;
    tag.textContent = label;
    body.appendChild(tag);
  }
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.innerHTML = html;
  body.appendChild(bubble);
  wrap.appendChild(av); wrap.appendChild(body);
  $chat.appendChild(wrap); scrollEnd();
}

function userMsg(html) {
  const wrap = document.createElement('div');
  wrap.className = 'msg user';
  const av = document.createElement('div');
  av.className = 'msg-avatar'; av.textContent = 'YOU';
  const body = document.createElement('div');
  body.className = 'msg-body';
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.innerHTML = html;
  body.appendChild(bubble);
  wrap.appendChild(av); wrap.appendChild(body);
  $chat.appendChild(wrap); scrollEnd();
}

function showTyping() {
  if (document.getElementById('typing-wrap')) return;
  const wrap = document.createElement('div');
  wrap.className = 'typing-wrap'; wrap.id = 'typing-wrap';
  const av = document.createElement('div');
  av.className = 'msg-avatar'; av.textContent = '✦';
  av.style.cssText = 'background:var(--accent);color:white;';
  const bubble = document.createElement('div');
  bubble.className = 'typing-bubble';
  for (let i=0;i<3;i++){const d=document.createElement('div');d.className='typing-dot';bubble.appendChild(d);}
  wrap.appendChild(av); wrap.appendChild(bubble);
  $chat.appendChild(wrap); scrollEnd();
  return bubble;
}

function updateBurstLabel(n) {
  const bubble = document.querySelector('.typing-bubble');
  if (!bubble) return;
  let lbl = bubble.querySelector('.burst-count');
  if (!lbl) { lbl = document.createElement('span'); lbl.className = 'burst-count'; bubble.appendChild(lbl); }
  lbl.textContent = n > 1 ? `${n}件まとめて考える…` : '';
}

function hideTyping() {
  const el = document.getElementById('typing-wrap'); if (el) el.remove();
}

function setChips(arr) {
  $qr.innerHTML = '';
  arr.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'chip'; btn.textContent = c;
    btn.onclick = () => { $input.value = c; handleSend(); };
    $qr.appendChild(btn);
  });
}

function showThemeCard(card) {
  const el = document.createElement('div');
  el.className = 'theme-card';
  el.innerHTML = `
    <div class="theme-card-label">📋 探究テーマ アドバイス</div>

    <div class="theme-row"><strong>次に調べること</strong>${card.nextSteps}</div>
    <div class="theme-row"><strong>コーチより</strong>${card.advice}</div>
  `;
  $chat.appendChild(el); scrollEnd();
}

//  SEND / QUEUE
// ══════════════════════════════════════════
function handleSend() {
  const text = $input.value.trim();
  if (!text) return;
  $input.value = ''; $input.style.height = 'auto';
  $qr.innerHTML = '';
  if (NG.test(text)) {
    userMsg(escHtml(text));
    const ctx = state.lastContext;
    aiMsg(ctx
      ? `それは探究とは関係ないね。さっきの「${ctx}」の話に戻ろう。`
      : `それは今の探究には関係ないね。気になってることを話してみて！`, 'guard');
    return;
  }
  queue.push(text);
  userMsg(escHtml(text));
  clearTimeout(burstTimer);
  if (processing) { updateBurstLabel(queue.length); return; }
  burstTimer = setTimeout(flushQueue, BURST_MS);
}

async function flushQueue() {
  if (queue.length === 0 || processing) return;
  processing = true;
  const burst   = [...queue]; queue = [];
  const combined = burst.join('\n');
  state.turnCount++;
  const short = combined.replace(/\n/g, '').length < 12 * burst.length;
  if (short) state.stuckCount++; else state.stuckCount = 0;
  state.history.push({ role: 'user', content: combined });
  showTyping();
  if (burst.length > 1) updateBurstLabel(burst.length);
  try {
    const reply = await callClaude(burst.length);
    hideTyping();
    const topicMatch = reply.match(/"topic"\s*:\s*"([^"]+)"/);
    if (topicMatch) updateTopic(topicMatch[1]);
    const stepMatch = reply.match(/"step"\s*:\s*(\d)/);
    if (stepMatch) updatePips(Math.min(parseInt(stepMatch[1]), 4));
    let card = null;
    const cardMatch = reply.match(/THEME_CARD:([\s\S]+?)END_CARD/);
    if (cardMatch) { try { card = JSON.parse(cardMatch[1].trim()); } catch(e){} }
    let chips = [];
    const chipsMatch = reply.match(/"chips"\s*:\s*(\[[^\]]+\])/);
    if (chipsMatch) { try { chips = JSON.parse(chipsMatch[1]); } catch(e){} }
    let tag = 'coach';
    if (/"vocab"\s*:\s*true/.test(reply)) tag = 'vocab';
    if (/"hint"\s*:\s*true/.test(reply))  tag = 'hint';
    let display = reply
      .replace(/\{[\s\S]*?\}/g, '')
      .replace(/THEME_CARD:[\s\S]+?END_CARD/, '')
      .trim();
    display = display
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>')
      .replace(/`(.+?)`/g, '<code>$1</code>')
      .replace(/^#{1,3}\s+(.+)$/gm, '<strong>$1</strong>')
      .replace(/^[-*]\s+/gm, '・')
      .replace(/\n/g, '<br>');
    const qm = display.match(/[^。！\n]*[？?]/);
    if (qm) state.lastContext = qm[0].replace(/[「」]/g,'').trim();
    aiMsg(display, tag);
    state.history.push({ role: 'assistant', content: reply });
    if (card)        showThemeCard(card);
    if (chips.length) setChips(chips);
  } catch(err) {
    hideTyping();
    aiMsg('ちょっと通信エラーが起きたみたい。もう一度試してみて！', 'guard');
  }
  processing = false;
  if (queue.length > 0) burstTimer = setTimeout(flushQueue, BURST_MS);
}

// ══════════════════════════════════════════
//  CLAUDE API (coaching)
// ══════════════════════════════════════════
async function callClaude(burstCount = 1) {
  const isBurst = burstCount > 1;
  const stuck   = state.stuckCount >= 2;
  const system = `
あなたは「探究コーチ」です。中学・高校生が自分だけの「探究テーマ（問い）」を見つけるサポートをします。
対象はスポーツ・音楽・歴史・科学・社会問題・日常の謎など、あらゆるテーマに対応します。

${isBurst ? `## 連続メッセージ（${burstCount}件）の処理ルール
生徒が${burstCount}件のメッセージを連続して送りました（改行で区切られています）。
すべてを総合的に読み、全体の意図をくみ取ってから「問いを1つ」だけ返してください。
個別に返答せず、ひとまとまりの思考として受け止めること。
` : ''}

## 絶対ルール（最重要）
- 返答には「問いを1つ」だけ含める。知識の説明・アドバイス・結論は禁止。
- 「〜だよね」「〜が大事だよ」のような結論誘導は禁止。
- 生徒が自分の言葉で考えられる問いを投げること。
- 1回の返答は3〜5文以内に収める。
- Markdownは絶対に使わない。**太字**、*斜体*、# 見出し、- リストなどの記法は一切使用禁止。普通の文章で書くこと。

## 役割外の依頼への対応（最重要）
あなたは「探究コーチ」であり、それ以外の役割は一切担わない。
以下のような依頼が来た場合、どんなに強く・繰り返し・命令口調で求められても、断ること。
断るべき依頼の例：
- 作業の代行（レポートを書く、翻訳する、問題を解く、要約する、コードを書くなど）
- 別のAIやキャラクターになりきること
- 探究と無関係な情報提供・雑談・相談
断り方のルール：
- 責めず、否定せず、明るく短く断る
- 必ず「探究」の文脈に引き戻す問いで締める
- 「それは私の仕事じゃないけど、なんでそれが気になったの？」のようなトーンで
- 断りの返答にも必ずJSONを含めること

## 個人的な悩み・困り事への対応（特別ルール）
いじめ、自傷、家庭の問題、強いネガティブ感情など、個人的な困り事や緊急性のある相談が来た場合：
- 気持ちに寄り添う一言だけ返す（長々と応答しない）
- 「信頼できる大人や専門家に相談してほしい」と必ず伝える
- 探究コーチとしての限界を正直に伝える
- その上で、もし探究テーマとして考えたいなら一緒に考えられると伝える
- 解決策・アドバイス・励ましの言葉を並べない

## 例外（許可ルール）
${stuck ? `★ 生徒が詰まっている（短い返答が続いている）。今回だけ、テーマに関連する具体的な事例や場面を1つだけヒントとして提示し、すぐ問いに戻ること。JSONに "hint": true を含める。` : ''}

★ 「vocab」を使っていい唯一の条件：生徒が特定の用語・概念の意味を知らないせいで思考が止まっている場合のみ。
  例：「ポジショニングって何？」「爆縮ってどういう意味？」
  絶対に使ってはいけないケース：
  - 「教えて」「見解を教えて」「どう思う？」などコーチへの問いかけ
  - 情報・答えを求めているだけの発言
  - 意見・感想を求めている発言
  該当する場合のみJSONに "vocab": true を含める。少しでも迷ったら含めない。

## 5段階の探究ステップ
0 SPARK   : 何が気になる？（興味の棚卸し）
1 ZOOM    : どこが・誰が・なぜ？（視点の分解）
2 COMPARE : AとB、どっちが？なぜそう思う？（比較・仮説）
3 SHARPEN : どんな条件で・いつ・どこで？（問いを絞る）
4 THEME   : 探究テーマをまとめる

現在のステップ: ${state.step}
会話回数: ${state.turnCount}回目
${state.topic ? `現在のテーマキーワード: 「${state.topic}」` : 'テーマ: まだ未特定'}

## ステップ進行ルール
- 生徒の返答が具体的・思考的 → 次のステップへ進む
- 短い・薄い返答 → 同じステップに留まり、別角度の問いを投げる
- 話題が大きく変わった・掘り下げが必要と判断した場合 → 前のステップに戻ってよい
- 3往復目以降は積極的にStep3〜4のテーマ化を目指す
- Step4に到達したら探究テーマカードを出す

## テーマ特定ルール
会話の中から生徒が探究したいテーマのキーワードを常に把握し、JSONの "topic" キーに毎回含めること。
テーマが変化した場合は新しいテーマに更新すること。まだ不明な場合は "topic" キー自体を省略すること。

## 良い問いの型（参考）
「それってなんでだと思う？」「逆に〜だったら、どうなる？」
「AとBを比べたら、どっちが〜だと思う？」「それっていつでも当てはまると思う？」

## 返答フォーマット（必ず最後にJSONを含める）
返答テキスト（問い1つ含む）

{"step": N, "topic": "現在のテーマキーワード（把握できている場合は毎回）", "vocab": true, "hint": true, "chips": ["返答候補1","返答候補2","返答候補3"]}
※ "vocab"・"hint" は該当する場合のみ含める。不要なら省略。

Step4のテーマカード出力時は返答内に以下を含める：
THEME_CARD:{"title":"探究テーマのタイトル","background":"背景・問題意識（2文）","nextSteps":"次に調べるべきこと","advice":"コーチからのひとこと"}
END_CARD
`.trim();

//  SOURCE CREDIBILITY
// ═══════════════════════════════════════
function getCredibilityFromTLD(url) {
  try {
    const host = new URL(url).hostname.replace(/^www\./, '');
    if (['.go.jp','.ac.jp','.or.jp'].some(t => host.endsWith(t)))
      return { level: 'trusted', label: '✓ 信頼性高' };
    if (['note.com','ameblo.jp','livedoor.blog','fc2.com','amazon.co.jp','rakuten.co.jp','togetter.com']
        .some(d => host === d || host.endsWith('.' + d)))
      return { level: 'caution', label: '⚠ 要確認' };
    return { level: 'unknown', label: '? 出典確認推奨' };
  } catch { return { level: 'unknown', label: '? 出典確認推奨' }; }
}

async function judgeCredibilityByAI(sources) {
  if (sources.length === 0) return sources;
  const list = sources.map((s, i) => `${i}: ${s.title} (${s.url})`).join('\n');
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 300,
        messages: [{ role: 'user', content:
          `以下のWebサイトそれぞれについて、中高生の探究学習における情報源としての信頼性を判定してください。
判定基準：
- trusted: 公式機関・政府・大学・学術機関・競技団体公式・大手報道機関
- caution: 個人ブログ・まとめサイト・EC・口コミサイト
- unknown: 上記以外の一般サイト・企業サイト等

${list}

以下のJSON形式のみで返してください（前後にテキスト不要）:
{"results":[{"index":0,"level":"trusted"},{"index":1,"level":"unknown"},...]}` }]
      })
    });
    const data = await res.json();
    const text = data.content?.[0]?.text || '';
    const m = text.match(/\{[\s\S]*\}/);
    if (!m) throw new Error('parse fail');
    const parsed = JSON.parse(m[0]);
    const labelMap = { trusted: '✓ 信頼性高', caution: '⚠ 要確認', unknown: '? 出典確認推奨' };
    return sources.map((s, i) => {
      const r = parsed.results?.find(r => r.index === i);
      const level = r?.level || 'unknown';
      return { ...s, credibility: { level, label: labelMap[level] } };
    });
  } catch {
    return sources.map(s => ({ ...s, credibility: getCredibilityFromTLD(s.url) }));
  }
}

const HISTORY_KEY = 'menmen_research_history';

function saveHistoryItem(item) {
  const history = loadHistory();
  history.unshift(item);
  localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
}
function loadHistory() {
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); } catch { return []; }
}
function clearHistory() {
  localStorage.removeItem(HISTORY_KEY);
  document.getElementById('research-results').innerHTML = '';
  document.getElementById('research-history-header').style.display = 'none';
}
function showHistoryHeader() {
  document.getElementById('research-history-header').style.display = 'block';
}
function restoreHistory() {
  const history = loadHistory();
  if (history.length === 0) return;
  [...history].reverse().forEach(item => {
    if (item.type === 'result') renderResearchResult(item.keyword, item.category, item.data, filterWebSources(item.webSources || []), filterPaperSources(item.paperSources || []), false);
    else if (item.type === 'error') renderResearchError(item.keyword, item.message, false);
  });
  showHistoryHeader();
}

      <div class="paper-search-desc">学術的な根拠を探したいときはこちら！</div>

        </span><span>→</span>

    </div>`;
}

// カードデータをメモリに保持（onclick属性のエスケープ問題を回避）
const researchCardStore = {};
let researchCardCounter = 0;

function renderResearchError(keyword, message, save = true) {
  const el = document.createElement('div');
  el.className = 'research-error';
  el.textContent = message;
  document.getElementById('research-results').prepend(el);
  showHistoryHeader();
  if (save) saveHistoryItem({ type: 'error', keyword, message });
}

  const resultsArea = document.getElementById('research-results');
  const card = document.createElement('div');
  card.className = 'research-result';

  // cardId を先に確定（questionsHTML より前に必要）
  const cardId = 'rc_' + (researchCardCounter++);
  researchCardStore[cardId] = { keyword, summary: data.summary };

  const questionsHTML = data.questions.map((q, qi) => {
    const qid = cardId + '_q' + qi;
    researchCardStore[qid] = q;
    return `<button class="research-q" onclick="copyQuestionToSearch('${qid}')">
      <span class="research-q-icon">→</span><span>${q}</span>
    </button>`;
  }).join('');

  const searchBase  = category ? `${category} ${keyword}` : keyword;
  const googleWords = [
    `${searchBase} 調査`, `${searchBase} 研究`, `${searchBase} データ`
  ];
  const googleHTML = `
    <div class="google-suggest">
      <div class="google-suggest-label">📱 GOOGLE 検索ワード</div>
      <div class="google-suggest-desc">リンクが開けない場合はこのキーワードでGoogle検索してみよう！</div>
      <div class="google-suggest-words">
        ${googleWords.map(w => `
          <a class="google-suggest-word" href="https://www.google.com/search?q=${encodeURIComponent(w)}" target="_blank" rel="noopener">
            <span>G</span><span>${w}</span>
          </a>`).join('')}
      </div>
    </div>`;

  // ── 信頼性判定（Web検索分） ──
  let judgedWeb = webSources;
  if (save && webSources.length > 0 && !webSources[0].credibility) {
    judgedWeb = await judgeCredibilityByAI(webSources);
  } else if (!save && webSources.length > 0 && !webSources[0].credibility) {
    judgedWeb = webSources.map(s => ({ ...s, credibility: getCredibilityFromTLD(s.url) }));
  }

  // ── 論文：credibility判定（TLDベース）──
  const judgedPapers = paperSources.map(s => ({
    ...s,
    credibility: s.credibility || getCredibilityFromTLD(s.url)
  }));

  // Web検索：信頼性高を優先、最大5件
  const sortedWeb = judgedWeb
    .slice()
    .sort((a,b) => { const o={trusted:0,unknown:1,caution:2}; return o[a.credibility?.level||'unknown']-o[b.credibility?.level||'unknown']; })
    .slice(0, 5);

  // 論文：PDF優先・日本語優先（URLにja/jpを含む）、最大5件
  const sortedPapers = judgedPapers
    .slice()
    .sort((a,b) => {
      const aJa = /\.jp|ja\.|\/(ja|jpn)\//.test(a.url) ? 0 : 1;
      const bJa = /\.jp|ja\.|\/(ja|jpn)\//.test(b.url) ? 0 : 1;
      const aPdf = a.isPdf ? 0 : 1;
      const bPdf = b.isPdf ? 0 : 1;
      return (aJa + aPdf) - (bJa + bPdf);
    })
    .slice(0, 5);

  const renderSourceLink = s => {
    const c = s.credibility || { level:'unknown', label:'? 出典確認推奨' };
    const pdfBadge = s.isPdf ? `<span class="source-badge badge-pdf">PDF</span>` : '';
    return `<a class="source-link" href="${s.url}" target="_blank" rel="noopener">
      <span>↗</span>
      <span class="source-link-text">${s.title}</span>
      ${pdfBadge}
      <span class="source-badge badge-${c.level}">${c.label}</span>
    </a>`;
  };
  // ソースセクションの注記
  const sourceNote = `<p class="source-note">※ サイトによってはアクセスできない場合があります</p>`;

  const webHTML = sortedWeb.length > 0
    ? sortedWeb.map(renderSourceLink).join('')
    : '<p style="font-size:12px;color:var(--ink-muted);padding:4px 0">見つかりませんでした</p>';

  const papersHTML = sortedPapers.length > 0
    ? sortedPapers.map(renderSourceLink).join('')
    : '<p style="font-size:12px;color:var(--ink-muted);padding:4px 0">見つかりませんでした</p>';

  const hasTrustedWeb = sortedWeb.some(s => s.credibility?.level === 'trusted');

  const sourcesHTML = `
    <hr class="research-divider">
    <div class="research-sources">
      <div class="research-sources-label">🌐 WEB検索結果</div>
      ${sourceNote}
      ${webHTML}
    </div>
    <div class="research-sources" style="margin-top:10px">
      <div class="research-sources-label">📄 論文検索結果</div>
      ${papersHTML}
    </div>
    ${!hasTrustedWeb ? googleHTML : ''}`;

  card.innerHTML = `
    <div class="research-result-header">🔍 RESEARCH RESULT</div>
    <div class="research-keyword-tag">キーワード：${keyword}</div>
    <div class="research-summary">${data.summary}</div>
    <hr class="research-divider">
    <div class="research-questions-label">💡 さらに調べられる問い（クリックで検索欄にセット）</div>
    <div class="research-questions">${questionsHTML}</div>
    ${sourcesHTML}
    ${buildPaperSearchHTML(keyword, category)}
`;
  resultsArea.prepend(card);
  showHistoryHeader();
  if (save) saveHistoryItem({ type:'result', keyword, category, data, webSources: judgedWeb, paperSources: judgedPapers });
}

// 問いをリサーチ検索欄にコピー（コーチングとは独立）
function copyQuestionToSearch(qid) {
  const q = researchCardStore[qid];
  if (!q) return;
  const input = document.getElementById('research-input');
  input.value = q;
  input.focus();
  input.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// ── ヘルパー ──
function extractContent(blocks) {
  let text = '';
  const allSources = [];
  for (const block of (blocks || [])) {
    if (block.type === 'text') text += block.text;
    if (block.type === 'web_search_tool_result') {
      for (const item of (block.content || [])) {
        if (item.url && item.title && !allSources.find(s => s.url === item.url)) {
          const isPdf = item.url.toLowerCase().includes('.pdf');
          allSources.push({ url: item.url, title: item.title, isPdf });
        }
      }
    }
  }
  // PDF優先で並び替え
  const sources = [
    ...allSources.filter(s => s.isPdf),
    ...allSources.filter(s => !s.isPdf),
  ];
  return { text, sources };
}

async function callAPI(payload) {
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });
  let data = await res.json();
  if (data.error) throw new Error(data.error.message);

  // pause_turn のとき: 1回目のcontentを保持しつつ続きを取得
  const allContent = [...(data.content || [])];
  while (data.stop_reason === 'pause_turn') {
    const res2 = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        ...payload,
        messages: [...payload.messages, { role: 'assistant', content: data.content }]
      })
    });
    data = await res2.json();
    if (data.error) throw new Error(data.error.message);
    allContent.push(...(data.content || []));
  }
  // 全ターンのcontentをマージして返す（sourcesが消えないように）
  return { ...data, content: allContent };
}

// ═══════════════════════════════════════
//  URL フィルター（グローバル）
// ═══════════════════════════════════════
const BLOCKED_DOMAINS_EXACT = ['nikkei.com', 'yomiuri.co.jp', 'sankei.com', 'asahi.com', 'waseda.jp', 'keio.jp'];
const isCFBlocked = u => {
  try {
    const host = new URL(u).hostname.replace(/^www\./, '');
    if (host.endsWith('.ac.jp')) return true;
    return BLOCKED_DOMAINS_EXACT.some(d => host === d || host.endsWith('.' + d));
  } catch { return false; }
};
const isScholarSearchPageG = u => /scholar\.google\.[a-z.]+\/(scholar)?(\?|$)/.test(u);
const isBookOrECG = u => /amazon\.co|rakuten\.co|books\.google|honto\.jp|bookwalker|kinokuniya|yodobashi|7net|ebookjapan|booklive|dmm\.com\/digital|isbn|biblioplaza/i.test(u);
const isUnivPromoG = u => /\/admission|\/(faculty|department|graduate|school|laboratory|lab)\/(?!research|paper)|syllabus|\/nyushi|\/gakubu|\/nyugaku/i.test(u);

function filterWebSources(sources) {
  return sources.filter(s => !isScholarSearchPageG(s.url) && !isBookOrECG(s.url) && !isUnivPromoG(s.url) && !isCFBlocked(s.url));
}
function filterPaperSources(sources) {
  return sources.filter(s => !isScholarSearchPageG(s.url) && !isCFBlocked(s.url));
}

// ═══════════════════════════════════════
//  RESEARCH — Main
// ═══════════════════════════════════════
async function doResearch() {
  const keyword = (document.getElementById('research-input').value || '').trim();
  if (!keyword) { alert('キーワードを入力してください'); return; }


  const btn = document.getElementById('research-btn');
  btn.disabled = true;

  const resultsArea = document.getElementById('research-results');
  const loadingEl   = document.createElement('div');
  loadingEl.className = 'research-loading';
  const displayLabel = `「${keyword}」`;
  loadingEl.innerHTML = `
    <div class="research-loading-dots"><span></span><span></span><span></span></div>
    <span>${displayLabel}を調べています...</span>`;
  resultsArea.prepend(loadingEl);

  try {
    // ── 2本並列検索 ──
    const [webData, paperData] = await Promise.all([

      // ① Web検索：信頼性の高い一般ページ＋サマリー生成
      callAPI({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        tools: [{ type: 'web_search_20250305', name: 'web_search' }],
        system: `あなたは中高生の探究学習をサポートするリサーチアシスタントです。
「${keyword}」についてweb_searchで調べてください。

目的：そのテーマの「内容・事実・現状・データ」が書かれたページを見つけること。
大学や研究機関のサイトは論文・研究ページのみ可。学部紹介・講義案内・入試情報は不可。

【優先するページの種類】
- 政府・省庁・自治体による統計・報告・解説ページ
- NHK・新聞社・通信社によるニュース・特集記事
- 公益法人・業界団体による調査・データページ
- Wikipedia（概要把握用）

【除外するページの種類】
- 大学の学部・学科・研究室の紹介ページ（/department/, /faculty/, /admission/ 等）
- 本・書籍の紹介・販売ページ
- Amazon・楽天などのECサイト
- 個人ブログ・まとめサイト・口コミサイト

検索クエリ例：「${keyword} 解説 OR 現状 OR データ OR 調査 -大学 -学部 -入試」

結果は以下のJSON形式のみで返してください（前後にテキスト不要）:
{"summary":"調べた内容の要点（3〜5文、中高生にわかりやすく）","questions":["探究の問い1（20字以内）","探究の問い2（20字以内）","探究の問い3（20字以内）"]}
questionsは「なぜ〜なのか」「〜するとどうなるか」「〜と〜はどちらが〜か」など検証可能な問いにすること。
意味不明な文字列・調査できない内容の場合は {"error":"もう少し具体的なキーワードを入れてみよう！"} を返すこと。`,
        messages: [{ role: 'user', content: `「${keyword}」の内容・現状・データを調べて。大学の学部紹介・書籍紹介・ECサイトは除いて。` }]
      }),

      // ② 論文検索：日本語論文優先、PDF直リンクを重視
      callAPI({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 400,
        tools: [{ type: 'web_search_20250305', name: 'web_search' }],
        system: `「${keyword}」に関する学術論文・研究報告を探してください。
以下の優先順位で複数回検索してください：
1. 「${keyword} 論文 filetype:pdf」→ 日本語PDFを優先
2. 「${keyword} 研究 site:jst.go.jp OR site:nii.ac.jp OR site:researchgate.net」
3. 「${keyword} academic paper filetype:pdf」
scholar.google.com の検索ページ自体（/scholar?q= など）は絶対に含めないこと。
実際の論文PDFページや研究機関ページのURLのみを収集すること。
返答は {"ok":true} のみでよい。`,
        messages: [{ role: 'user', content: `「${keyword}」の日本語論文・PDF資料を検索して` }]
      })
    ]);

    const { text, sources: webSources } = extractContent(webData.content);
    const { sources: paperSources }     = extractContent(paperData.content);

    // scholar.google.com 検索ページを除外
    const cleanWeb    = filterWebSources(webSources);
    const cleanPapers = filterPaperSources(paperSources);

    loadingEl.remove();

    let parsed = null;
    const m = text.match(/\{[\s\S]*\}/);
    if (m) { try { parsed = JSON.parse(m[0]); } catch(e) {} }

    if (parsed?.error) {
      renderResearchError(keyword, parsed.error);
    } else if (parsed?.summary && parsed?.questions) {
      renderResearchResult(keyword, null, parsed, cleanWeb, cleanPapers);
    } else {
      renderResearchError(keyword, text || '結果を取得できませんでした。もう一度試してみて！');
    }
  } catch(e) {
    loadingEl.remove();
    renderResearchError(keyword, `エラーが発生しました: ${e.message}`);
  } finally {
    btn.disabled = false;
  }
}
